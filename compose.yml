# Local development stack
#
# This file is the only Compose file developers should need.
# Common commands:
#   docker compose up --build -d
#   docker compose logs -f frontend
#   docker compose down --remove-orphans
#
# Common footguns:
# - `.env` values override `.env.example`; stale local values can cause surprising behavior.
# - This workflow intentionally requires `.env`; if it is missing, Compose should fail loudly.
# - `VITE_API_BASE_URL` must point at a running backend API for project and district data.
# - `VITE_CARTO_API_KEY` is required for unwatermarked CARTO basemap tiles.

services:
  frontend:
    build:
      context: .
    image: citywise-frontend-dev
    env_file:
      - ./.env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18100}
      VITE_PORT: ${VITE_PORT:-5173}
    ports:
      - "${FRONTEND_HOST_PORT:-15173}:${VITE_PORT:-5173}"
    volumes:
      - .:/app
      - citywise_frontend_node_modules:/app/node_modules
    command:
      [
        "sh",
        "-c",
        "npm ci && npm run dev -- --host 0.0.0.0 --port ${VITE_PORT:-5173}",
      ]

volumes:
  citywise_frontend_node_modules:
